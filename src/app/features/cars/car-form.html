<app-page-header
  [title]="(isEdit() ? 'cars.editTitle' : 'cars.createTitle') | t"
  [subtitle]="(isEdit() ? 'cars.editSubtitle' : 'cars.createSubtitle') | t"
/>

@if (welcome() && !isEdit()) {
  <div class="mb-6 flex items-start gap-3 rounded-xl bg-emerald-50 p-4 text-sm text-emerald-900">
    <mat-icon class="!h-5 !w-5 !text-xl">check_circle</mat-icon>
    <span>{{ 'cars.welcomeBanner' | t }}</span>
  </div>
}

@if (loading()) {
  <div class="grid h-64 place-items-center"><mat-spinner diameter="40" /></div>
} @else {
  <mat-card class="w-full max-w-xl">
    <mat-card-content class="!p-4 md:!p-6">
      @if (errorMessage()) {
        <div class="mb-4 flex items-start gap-2 rounded-lg bg-rose-50 p-3 text-sm text-rose-900">
          <mat-icon class="!h-5 !w-5 !text-xl">error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'cars.label' | t }}</mat-label>
          <input matInput formControlName="nickname" [placeholder]="'cars.labelPlaceholder' | t" />
          <mat-hint>{{ 'cars.labelHint' | t }}</mat-hint>
        </mat-form-field>

        @if (isEdit()) {
          <div class="mt-2 rounded-lg bg-slate-50 p-4">
            <mat-slide-toggle formControlName="isActive">{{ 'cars.codeActive' | t }}</mat-slide-toggle>
            <p class="mt-1 text-xs text-slate-500">
              {{ 'cars.codeActiveHint' | t }}
            </p>
          </div>
        }

        <div class="mt-4 flex flex-col gap-2 md:flex-row">
          <button
            mat-flat-button
            color="primary"
            class="!h-11 w-full md:w-auto"
            type="submit"
            [disabled]="saving()"
          >
            {{ saving() ? ('common.saving' | t) : isEdit() ? ('common.save' | t) : ('cars.createSubmit' | t) }}
          </button>
          <button
            mat-stroked-button
            class="!h-11 w-full md:w-auto"
            type="button"
            (click)="cancel()"
          >
            {{ 'common.cancel' | t }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}
