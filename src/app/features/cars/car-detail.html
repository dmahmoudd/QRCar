<div class="mx-auto flex w-full max-w-3xl flex-col gap-6">
  @if (loading()) {
    <div class="grid h-64 place-items-center"><mat-spinner diameter="40" /></div>
  } @else if (errorMessage()) {
    <div class="rounded-xl bg-error-container p-4 text-sm text-on-error-container">{{ errorMessage() }}</div>
  } @else if (car(); as vehicle) {
    <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <div class="max-w-2xl">
        <div
          class="mb-2 inline-flex items-center gap-1.5 rounded-full bg-primary-container/15 px-2.5 py-0.5 text-[10px] font-bold tracking-wider text-primary uppercase"
        >
          <span class="icon-slot icon-slot-sm"><mat-icon>qr_code_2</mat-icon></span>
          <span>{{ 'cars.heroEyebrow' | t }}</span>
        </div>
        <h1
          class="font-[family-name:var(--font-display)] text-[26px] leading-8 font-bold tracking-tight text-on-surface sm:text-[32px] sm:leading-10"
        >
          {{ 'cars.title' | t }}
        </h1>
        <p class="mt-1 text-sm leading-6 text-on-surface-variant">{{ 'cars.detailSubtitle' | t }}</p>
      </div>

      <a
        routerLink="/cars/new"
        class="inline-flex h-12 shrink-0 items-center justify-center gap-2 rounded-full bg-gradient-to-r from-primary-container to-tertiary-container px-5 text-sm font-bold text-on-primary-container shadow-md"
      >
        <span class="icon-slot"><mat-icon>add</mat-icon></span>
        <span>{{ 'common.addCar' | t }}</span>
      </a>
    </div>

    <app-car-sticker-card
      [car]="vehicle"
      (remove)="confirmDelete($event)"
      (rotated)="onRotated()"
    />

    <p class="rounded-xl bg-surface-container-low p-4 text-xs leading-5 text-on-surface-variant">
      {{ 'cars.detailHint' | t }}
    </p>
  }
</div>
