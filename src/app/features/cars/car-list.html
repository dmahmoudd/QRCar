<app-page-header [title]="'cars.title' | t" [subtitle]="'cars.subtitle' | t">
  <button mat-flat-button color="primary" routerLink="/cars/new">
    <mat-icon>add</mat-icon>
    {{ 'common.addCar' | t }}
  </button>
</app-page-header>

@if (loading()) {
  <div class="grid h-64 place-items-center"><mat-spinner diameter="40" /></div>
} @else if (errorMessage()) {
  <div class="rounded-lg bg-rose-50 p-4 text-sm text-rose-900">{{ errorMessage() }}</div>
} @else if (cars().length === 0) {
  <mat-card>
    <app-empty-state
      icon="directions_car"
      [title]="'cars.empty' | t"
      [description]="'cars.emptyHint' | t"
    >
      <button mat-flat-button color="primary" class="!mt-2" routerLink="/cars/new">
        <mat-icon>add</mat-icon>
        {{ 'cars.addFirst' | t }}
      </button>
    </app-empty-state>
  </mat-card>
} @else {
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3">
    @for (car of cars(); track car.id) {
      <mat-card class="!p-4 md:!p-5">
        <div class="flex items-start justify-between gap-2">
          <a [routerLink]="['/cars', car.id]" class="min-w-0 flex-1">
            <p class="truncate font-semibold text-slate-900">
              {{ car.nickname || ('common.qrCode' | t) }}
            </p>
            <p class="mt-0.5 font-mono text-sm text-slate-500">{{ car.plateNumber }}</p>
          </a>

          <button mat-icon-button [matMenuTriggerFor]="menu" [attr.aria-label]="'cars.actions' | t">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item [routerLink]="['/cars', car.id]">
              <mat-icon>qr_code_2</mat-icon>
              <span>{{ 'cars.qrCode' | t }}</span>
            </button>
            <button mat-menu-item [routerLink]="['/cars', car.id, 'edit']">
              <mat-icon>edit</mat-icon>
              <span>{{ 'cars.editDetails' | t }}</span>
            </button>
            <button mat-menu-item (click)="confirmDelete(car)">
              <mat-icon>delete_outline</mat-icon>
              <span>{{ 'cars.remove' | t }}</span>
            </button>
          </mat-menu>
        </div>

        <div class="mt-4 flex items-center justify-end">
          @if (!car.isActive) {
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600">
              {{ 'common.paused' | t }}
            </span>
          }
        </div>
      </mat-card>
    }
  </div>
}
