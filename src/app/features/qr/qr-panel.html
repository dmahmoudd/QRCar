<section
  class="min-w-0 overflow-hidden"
  [class.rounded-xl]="!embedded()"
  [class.bg-surface-container-lowest]="!embedded()"
  [class.p-4]="!embedded()"
  [class.shadow-sm]="!embedded()"
  [class.md:p-6]="!embedded()"
>
  @if (!embedded()) {
    <h2 class="font-[family-name:var(--font-display)] text-lg font-semibold text-on-surface">
      {{ 'qr.title' | t }}
    </h2>
    <p class="mt-1 text-sm leading-5 text-on-surface-variant">{{ 'qr.subtitle' | t }}</p>
  }

  @if (loading()) {
    <div class="grid h-56 place-items-center">
      <mat-spinner diameter="40" />
    </div>
  } @else if (errorMessage()) {
    <div class="mt-4 rounded-lg bg-error-container p-3 text-sm text-on-error-container">{{ errorMessage() }}</div>
  } @else if (qr(); as code) {
    <div
      class="flex w-full min-w-0 flex-col gap-4 rounded-xl bg-surface-container-low p-4 md:flex-row md:items-stretch"
      [class.mt-5]="!embedded()"
    >
      <div
        class="flex w-full shrink-0 flex-col items-center gap-3 rounded-lg bg-surface-container-lowest p-4 shadow-sm md:w-56"
      >
        <div class="aspect-square w-full max-w-[14rem]">
          @if (imageUrl()) {
            <img
              [src]="imageUrl()"
              [alt]="'qr.alt' | t"
              class="mx-auto block h-full w-full object-contain"
              width="256"
              height="256"
            />
          }
        </div>
        <p class="text-center text-xs font-semibold text-on-surface">{{ 'qr.scanPrompt' | t }}</p>
      </div>

      <div class="flex min-w-0 flex-1 flex-col justify-between gap-3">
        <div class="min-w-0">
          <p class="mb-1 text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">
            {{ 'qr.destination' | t }}
          </p>
          <div class="flex min-w-0 items-start gap-2 rounded-lg bg-surface-container-lowest p-3">
            <p class="min-w-0 flex-1 break-all text-xs leading-5 text-on-surface">{{ code.scanUrl }}</p>
            <button
              type="button"
              class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-primary hover:bg-surface-container"
              [attr.aria-label]="'qr.copyAria' | t"
              (click)="copyLink(code.scanUrl)"
            >
              <span class="icon-slot"><mat-icon>content_copy</mat-icon></span>
            </button>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button
            type="button"
            class="inline-flex h-10 min-w-0 flex-1 items-center justify-center gap-1.5 rounded-lg bg-surface-container px-3 text-xs font-semibold text-on-surface hover:bg-surface-container-high"
            (click)="download('Png')"
          >
            <span class="icon-slot icon-slot-sm"><mat-icon>download</mat-icon></span>
            <span>{{ 'qr.pngSticker' | t }}</span>
          </button>
          <button
            type="button"
            class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-primary-container text-on-primary-container shadow-sm hover:brightness-95"
            [attr.aria-label]="'qr.print' | t"
            (click)="print(code)"
          >
            <span class="icon-slot"><mat-icon>print</mat-icon></span>
          </button>
          <button
            type="button"
            class="inline-flex h-10 min-w-0 items-center justify-center gap-1.5 rounded-lg bg-surface-container px-3 text-xs font-semibold text-on-surface hover:bg-surface-container-high"
            (click)="confirmRotate()"
          >
            <span class="icon-slot icon-slot-sm"><mat-icon>autorenew</mat-icon></span>
            <span>{{ 'qr.replace' | t }}</span>
          </button>
        </div>
      </div>
    </div>
  }
</section>
