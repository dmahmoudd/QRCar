<section class="min-w-0 overflow-hidden rounded-xl bg-surface-container-lowest p-4 shadow-sm md:p-6">
  <h2 class="font-[family-name:var(--font-display)] text-lg font-semibold text-on-surface">
    {{ 'qr.title' | t }}
  </h2>
  <p class="mt-1 text-sm leading-5 text-on-surface-variant">{{ 'qr.subtitle' | t }}</p>

  @if (loading()) {
    <div class="grid h-56 place-items-center">
      <mat-spinner diameter="40" />
    </div>
  } @else if (errorMessage()) {
    <div class="mt-4 rounded-lg bg-error-container p-3 text-sm text-on-error-container">{{ errorMessage() }}</div>
  } @else if (qr(); as code) {
    <div class="mt-5 flex w-full min-w-0 flex-col items-center gap-4">
      <div class="aspect-square w-full max-w-[16rem]">
        @if (imageUrl()) {
          <img
            [src]="imageUrl()"
            [alt]="'qr.alt' | t"
            class="mx-auto block h-full w-full object-contain"
            width="256"
            height="256"
          />
        }
      </div>

      <div class="w-full min-w-0">
        <p class="mb-1 text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">
          {{ 'qr.destination' | t }}
        </p>
        <div class="flex min-w-0 items-start gap-2 rounded-lg bg-surface-container-low p-3">
          <p class="min-w-0 flex-1 break-all text-xs leading-5 text-on-surface-variant">{{ code.scanUrl }}</p>
          <button
            type="button"
            class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-on-surface"
            [attr.aria-label]="'qr.copyAria' | t"
            (click)="copyLink(code.scanUrl)"
          >
            <span class="icon-slot"><mat-icon>content_copy</mat-icon></span>
          </button>
        </div>
      </div>

      <div class="grid w-full grid-cols-2 gap-2">
        <button
          type="button"
          class="inline-flex h-11 min-w-0 items-center justify-center gap-1.5 rounded-full bg-gradient-to-r from-primary-container to-tertiary-container px-2 text-xs font-bold text-on-primary-container"
          (click)="download('Png')"
        >
          <span class="icon-slot icon-slot-sm"><mat-icon>download</mat-icon></span>
          <span>{{ 'qr.png' | t }}</span>
        </button>
        <button
          type="button"
          class="inline-flex h-11 min-w-0 items-center justify-center gap-1.5 rounded-full bg-surface-container-high px-2 text-xs font-semibold text-on-surface"
          (click)="download('Svg')"
        >
          <span class="icon-slot icon-slot-sm"><mat-icon>download</mat-icon></span>
          <span>{{ 'qr.svg' | t }}</span>
        </button>
        <button
          type="button"
          class="inline-flex h-11 min-w-0 items-center justify-center gap-1.5 rounded-full bg-surface-container-high px-2 text-xs font-semibold text-on-surface"
          (click)="print(code)"
        >
          <span class="icon-slot icon-slot-sm"><mat-icon>print</mat-icon></span>
          <span>{{ 'qr.print' | t }}</span>
        </button>
        <button
          type="button"
          class="inline-flex h-11 min-w-0 items-center justify-center gap-1.5 rounded-full bg-surface-container-high px-2 text-xs font-semibold text-on-surface"
          (click)="confirmRotate()"
        >
          <span class="icon-slot icon-slot-sm"><mat-icon>autorenew</mat-icon></span>
          <span>{{ 'qr.replace' | t }}</span>
        </button>
      </div>
    </div>
  }
</section>
