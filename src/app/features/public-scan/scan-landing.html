<mat-card>
  <mat-card-content class="!p-5 text-center md:!p-8">
    <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-accent-50">
      <mat-icon class="!h-7 !w-7 !text-3xl text-accent-600">security</mat-icon>
    </div>
    <h1 class="text-lg font-semibold text-slate-900">{{ 'landing.title' | t }}</h1>
    <p class="mt-3 text-sm text-slate-500">
      {{ 'landing.body' | t }}
    </p>
    <p class="mt-4 text-xs leading-5 text-slate-400">
      {{ 'landing.hint' | t }}
    </p>

    <a
      mat-flat-button
      color="primary"
      class="!mt-6 !h-12 w-full"
      [routerLink]="scannerPath"
    >
      <mat-icon>qr_code_scanner</mat-icon>
      {{ 'landing.open' | t }}
    </a>
    <p class="mt-3 text-xs text-slate-400">
      {{ 'landing.cameraHint' | t }}
    </p>
  </mat-card-content>
</mat-card>
