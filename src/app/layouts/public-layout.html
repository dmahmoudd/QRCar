<div class="flex min-h-dvh w-full max-w-full flex-col overflow-x-clip bg-surface">
  <header class="shell-toolbar">
    <a routerLink="/" class="shell-toolbar-brand" aria-label="طلعني">
      <app-brand-logo fullClass="h-9 w-9 object-contain" />
      <span>{{ 'brand.name' | t }}</span>
    </a>
    <div class="shell-toolbar-end">
      <app-language-switcher tone="dark" />
      <a routerLink="/scan" class="text-sm font-semibold text-primary-container hover:underline">
        {{ 'public.scanQr' | t }}
      </a>
    </div>
  </header>

  <main class="mx-auto w-full min-w-0 max-w-[580px] flex-1 px-4 py-5">
    <router-outlet />
  </main>

  <footer
    class="px-4 py-6 text-center text-xs text-brand-400"
    style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom))"
  >
    {{ 'public.privacy' | t }}
  </footer>
</div>
