<div class="shell-frame">
  <header class="shell-toolbar">
    <div class="shell-toolbar-start">
      @if (isHandset()) {
        <button
          mat-icon-button
          class="shell-toolbar-icon"
          [attr.aria-label]="'nav.openMenu' | t"
          (click)="drawerOpen.set(!drawerOpen())"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }

      <a routerLink="/cars" class="shell-toolbar-brand" aria-label="طلعني">
        <app-brand-logo fullClass="h-9 w-9 object-contain" />
        <span>{{ 'brand.name' | t }}</span>
      </a>
    </div>

    <div class="shell-toolbar-end">
      <app-language-switcher tone="dark" />

      <button
        mat-icon-button
        class="shell-toolbar-icon"
        routerLink="/requests"
        [attr.aria-label]="'nav.requests' | t"
        [matBadge]="pendingCount()"
        [matBadgeHidden]="pendingCount() === 0"
        matBadgeColor="warn"
        matBadgeSize="small"
      >
        <mat-icon>notifications</mat-icon>
      </button>

      <button
        mat-button
        class="shell-toolbar-user"
        [matMenuTriggerFor]="accountMenu"
        [attr.aria-label]="'nav.account' | t"
      >
        <mat-icon>account_circle</mat-icon>
        <span class="shell-toolbar-user-name">{{ user()?.fullName }}</span>
      </button>

      <mat-menu #accountMenu="matMenu">
        <div class="px-4 py-2">
          <p class="text-sm font-medium text-slate-800">{{ user()?.fullName }}</p>
          <p class="text-xs text-slate-500">{{ user()?.email }}</p>
        </div>
        <mat-divider />
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>{{ 'nav.profile' | t }}</span>
        </button>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'nav.signOut' | t }}</span>
        </button>
      </mat-menu>
    </div>
  </header>

  <mat-sidenav-container class="shell-body bg-brand-50">
    <mat-sidenav
      class="shell-nav border-e border-brand-100"
      position="start"
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="isHandset() ? drawerOpen() : true"
      (closedStart)="drawerOpen.set(false)"
    >
      <nav class="shell-menu" [attr.aria-label]="'nav.openMenu' | t">
        @for (item of navItems; track item.path) {
          <a
            class="shell-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            (click)="closeOnMobile()"
          >
            <span class="shell-link-icon-wrap" dir="ltr">
              <mat-icon class="shell-link-icon" [fontIcon]="item.icon" aria-hidden="true" />
            </span>
            <span class="shell-link-label">{{ item.labelKey | t }}</span>
            @if (item.path === '/requests' && pendingCount() > 0) {
              <span class="shell-link-count">{{ pendingCount() }}</span>
            }
          </a>
        }
      </nav>
    </mat-sidenav>

    <mat-sidenav-content class="min-w-0">
      <main
        class="mx-auto w-full min-w-0 max-w-7xl flex-1 px-4 py-5 md:px-8 md:py-8 xl:px-10 xl:py-10"
        style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom))"
      >
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
