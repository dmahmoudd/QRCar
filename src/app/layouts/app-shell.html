<mat-sidenav-container class="min-h-dvh w-full bg-slate-50">
  <mat-sidenav
    class="shell-nav border-r border-slate-200"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="isHandset() ? drawerOpen() : true"
    (closedStart)="drawerOpen.set(false)"
  >
    <div class="flex items-center gap-2 px-5 py-5">
      <mat-icon class="text-brand-600">qr_code_2</mat-icon>
      <span class="font-semibold text-slate-800">Tala3ny</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          [activated]="link.isActive"
          (click)="closeOnMobile()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="flex min-h-dvh min-w-0 flex-col">
    <mat-toolbar class="border-b border-slate-200 bg-white">
      @if (isHandset()) {
        <button mat-icon-button aria-label="Open menu" (click)="drawerOpen.set(!drawerOpen())">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="min-w-0 flex-1 truncate px-2 text-base font-semibold text-slate-800">
        @if (isHandset()) {
          Tala3ny
        }
      </span>

      <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #accountMenu="matMenu">
        <div class="px-4 py-2">
          <p class="text-sm font-medium text-slate-800">{{ user()?.fullName }}</p>
          <p class="text-xs text-slate-500">{{ user()?.email }}</p>
        </div>
        <mat-divider />
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main
      class="mx-auto w-full min-w-0 max-w-7xl flex-1 px-4 py-5 md:px-8 md:py-8 xl:px-10 xl:py-10"
      style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom))"
    >
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
